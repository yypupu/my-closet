<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFE14D">
<meta name="description" content="手持ちの服・ほしい物・自分のサイズを、端末の中だけに保存して管理できる無料のファッションアプリ">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Myクローゼット">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px)}</style>
</head>
<body>
<title>Myクローゼット</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Bodoni+Moda:ital,wght@0,500;1,500&family=Cormorant+Garamond:ital,wght@1,500;1,600&family=DM+Mono:wght@400;500&family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;700;800&family=Mochiy+Pop+One&family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Maru+Gothic:wght@400;500;700&family=Zen+Old+Mincho:wght@600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
/* Layout: 1カラムのスマホアプリ。上部ヘッダー＋下部タブ。写真グリッドと余白が主役、操作はボトムシートで行う */
:root{
  --bg:#F3F4F2; --surface:#FFFFFF; --ink:#17191A; --muted:#6A706E; --line:#E1E4E1;
  --accent:#1F4E4A; --accent-ink:#FFFFFF; --accent-soft:#E2ECE9;
  --ok:#2F6B45; --ok-soft:#E3F0E6; --warn:#9A5521; --warn-soft:#F6EBDF; --danger:#B03636; --danger-soft:#F7E3E1;
  --shade:rgba(15,20,19,.42); --photo:#E9EBE8;
  --f-display:"Zen Old Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;
  --f-num:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:14px; --r-sm:10px; --btn-r:999px; --bw:1px; --hair:var(--line);
  --f-en:var(--f-display); --en-size:11px; --en-style:normal; --en-weight:500; --en-case:uppercase; --en-ls:.26em; --en-color:var(--muted);
  --ja-size:26px; --ja-ls:.02em; --ja-color:var(--ink);
  --tabbg:var(--surface); --tabfg:var(--muted); --tabon:var(--ink); --tabicon:var(--accent);
  --fab-bg:var(--ink); --fab-fg:var(--bg); --chip-on-bg:var(--ink); --chip-on-fg:var(--bg);
  --card-shadow:none; --card-border:0 solid transparent; --btn-shadow:none;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111413; --surface:#1A1E1D; --ink:#ECEFEE; --muted:#9AA3A0; --line:#2A302E;
  --accent:#8CC3B9; --accent-ink:#0F1A18; --accent-soft:#1E2D2A;
  --ok:#86C79A; --ok-soft:#1C2B21; --warn:#E3A56C; --warn-soft:#2E241B; --danger:#EE8A84; --danger-soft:#33201F;
  --shade:rgba(0,0,0,.6); --photo:#242928; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111413; --surface:#1A1E1D; --ink:#ECEFEE; --muted:#9AA3A0; --line:#2A302E;
  --accent:#8CC3B9; --accent-ink:#0F1A18; --accent-soft:#1E2D2A;
  --ok:#86C79A; --ok-soft:#1C2B21; --warn:#E3A56C; --warn-soft:#2E241B; --danger:#EE8A84; --danger-soft:#33201F;
  --shade:rgba(0,0,0,.6); --photo:#242928; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}

/* ===== デザインパターン ===== */
:root[data-style="mode"]{
  --bg:#FFFFFF; --surface:#FFFFFF; --ink:#0B0B0B; --muted:#7E7E7E; --line:#E3E3E3; --hair:#ECECEC;
  --accent:#0B0B0B; --accent-ink:#FFFFFF; --accent-soft:#F3F3F2;
  --ok:#2E6A43; --ok-soft:#EAF2EC; --warn:#8C5A24; --warn-soft:#F6EFE6; --danger:#A32D2D; --danger-soft:#F8E6E6; --shade:rgba(0,0,0,.45); --photo:#F1F0EE;
  --f-display:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif; --f-en:"Bodoni Moda","Bodoni 72","Didot",serif;
  --r:0px; --r-sm:0px; --btn-r:0px;
  --en-size:48px; --en-style:italic; --en-weight:500; --en-case:none; --en-ls:-.01em; --en-color:var(--ink);
  --ja-size:11px; --ja-ls:.3em; --ja-color:var(--muted);
  --tabbg:#FFFFFF; --tabfg:#A0A0A0; --tabon:#0B0B0B; --tabicon:#0B0B0B; --fab-bg:#0B0B0B; --fab-fg:#FFFFFF; --chip-on-bg:#0B0B0B; --chip-on-fg:#FFFFFF;
  --card-shadow:none; --card-border:0 solid transparent; --btn-shadow:none}
@media (prefers-color-scheme: dark){:root[data-style="mode"]:not([data-theme="light"]){
  --bg:#0A0A0A; --surface:#121212; --ink:#F4F4F4; --muted:#8E8E8E; --line:#2A2A2A; --hair:#222222; --accent:#F4F4F4; --accent-ink:#0A0A0A; --accent-soft:#1B1B1B;
  --ok:#8FD0A2; --ok-soft:#17221A; --warn:#E1AE74; --warn-soft:#2A2118; --danger:#F08F8F; --danger-soft:#2C1717; --shade:rgba(0,0,0,.65); --photo:#1A1A1A;
  --tabbg:#0A0A0A; --tabfg:#6E6E6E; --tabon:#F4F4F4; --tabicon:#F4F4F4; --fab-bg:#F4F4F4; --fab-fg:#0A0A0A; --chip-on-bg:#F4F4F4; --chip-on-fg:#0A0A0A; color-scheme:dark}}
:root[data-style="mode"][data-theme="dark"]{
  --bg:#0A0A0A; --surface:#121212; --ink:#F4F4F4; --muted:#8E8E8E; --line:#2A2A2A; --hair:#222222; --accent:#F4F4F4; --accent-ink:#0A0A0A; --accent-soft:#1B1B1B;
  --ok:#8FD0A2; --ok-soft:#17221A; --warn:#E1AE74; --warn-soft:#2A2118; --danger:#F08F8F; --danger-soft:#2C1717; --shade:rgba(0,0,0,.65); --photo:#1A1A1A;
  --tabbg:#0A0A0A; --tabfg:#6E6E6E; --tabon:#F4F4F4; --tabicon:#F4F4F4; --fab-bg:#F4F4F4; --fab-fg:#0A0A0A; --chip-on-bg:#F4F4F4; --chip-on-fg:#0A0A0A; color-scheme:dark}
:root[data-style="mode"] .panel{border-left:0;border-right:0;background:transparent;padding-inline:0}
:root[data-style="mode"] .cmeta .k,:root[data-style="mode"] .panel h2,:root[data-style="mode"] .sec-h{letter-spacing:.22em;font-size:10.5px}
:root[data-style="mode"] .cmeta b{font-weight:400}
:root[data-style="mode"] .grid{gap:26px 10px}
:root[data-style="mode"] .tab{font-size:9.5px;letter-spacing:.12em}

:root[data-style="blush"]{
  --bg:#F8F0EC; --surface:#FFFCFA; --ink:#3B2F2F; --muted:#9C8783; --line:#EEDFD9; --hair:#F1E6E1;
  --accent:#B85C70; --accent-ink:#FFFFFF; --accent-soft:#F7E3E5;
  --ok:#4E7A55; --ok-soft:#E8F1E6; --warn:#A0612F; --warn-soft:#F8EADC; --danger:#B4424F; --danger-soft:#F8E1E2; --shade:rgba(60,30,35,.35); --photo:#F1E4DF;
  --f-display:"Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif; --f-body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif; --f-en:"Cormorant Garamond","Garamond",Georgia,serif;
  --r:24px; --r-sm:16px; --btn-r:999px;
  --en-size:46px; --en-style:italic; --en-weight:600; --en-case:none; --en-ls:0; --en-color:var(--accent);
  --ja-size:12px; --ja-ls:.22em; --ja-color:var(--muted);
  --tabbg:#FFFCFA; --tabfg:#B19C98; --tabon:#3B2F2F; --tabicon:#B85C70; --fab-bg:#B85C70; --fab-fg:#FFFFFF; --chip-on-bg:#B85C70; --chip-on-fg:#FFFFFF;
  --card-shadow:0 10px 26px rgba(150,90,90,.13); --card-border:0 solid transparent; --btn-shadow:none}
@media (prefers-color-scheme: dark){:root[data-style="blush"]:not([data-theme="light"]){
  --bg:#1C1517; --surface:#261D20; --ink:#F4E8E6; --muted:#B49E9A; --line:#3A2C30; --hair:#33272A; --accent:#EE9DAE; --accent-ink:#2A161C; --accent-soft:#3B252B;
  --ok:#93C99B; --ok-soft:#1F2A20; --warn:#E8B07E; --warn-soft:#33251A; --danger:#F3949B; --danger-soft:#3A1F22; --shade:rgba(0,0,0,.6); --photo:#30252A;
  --tabbg:#1C1517; --tabfg:#8C7774; --tabon:#F4E8E6; --tabicon:#EE9DAE; --fab-bg:#EE9DAE; --fab-fg:#2A161C; --chip-on-bg:#EE9DAE; --chip-on-fg:#2A161C; --card-shadow:none; color-scheme:dark}}
:root[data-style="blush"][data-theme="dark"]{
  --bg:#1C1517; --surface:#261D20; --ink:#F4E8E6; --muted:#B49E9A; --line:#3A2C30; --hair:#33272A; --accent:#EE9DAE; --accent-ink:#2A161C; --accent-soft:#3B252B;
  --ok:#93C99B; --ok-soft:#1F2A20; --warn:#E8B07E; --warn-soft:#33251A; --danger:#F3949B; --danger-soft:#3A1F22; --shade:rgba(0,0,0,.6); --photo:#30252A;
  --tabbg:#1C1517; --tabfg:#8C7774; --tabon:#F4E8E6; --tabicon:#EE9DAE; --fab-bg:#EE9DAE; --fab-fg:#2A161C; --chip-on-bg:#EE9DAE; --chip-on-fg:#2A161C; --card-shadow:none; color-scheme:dark}
:root[data-style="blush"] .panel{border-color:transparent;box-shadow:0 6px 20px rgba(150,90,90,.07)}
:root[data-style="blush"] .chip{border-color:transparent}
:root[data-style="blush"] .chip:not([aria-pressed="true"]){background:var(--surface)}
:root[data-style="blush"] .cmeta{padding-inline:4px}

:root[data-style="street"]{
  --bg:#ECEBE6; --surface:#FFFFFF; --ink:#121212; --muted:#5C5C57; --line:#121212; --hair:#D2D1CB;
  --accent:#F28C28; --accent-ink:#121212; --accent-soft:#FDE4CB;
  --ok:#23733F; --ok-soft:#DDF0E2; --warn:#A0510E; --warn-soft:#FBE8D6; --danger:#C22B2B; --danger-soft:#F9DEDE; --shade:rgba(0,0,0,.5); --photo:#DCDBD5;
  --f-display:"Dela Gothic One","Hiragino Sans",sans-serif; --f-en:"Anton",Impact,"Arial Narrow",sans-serif;
  --bw:2px; --r:6px; --r-sm:6px; --btn-r:6px;
  --en-size:60px; --en-style:normal; --en-weight:400; --en-case:uppercase; --en-ls:.01em; --en-color:var(--ink);
  --ja-size:13px; --ja-ls:.06em; --ja-color:var(--ink);
  --tabbg:#121212; --tabfg:#9C9C96; --tabon:#FFFFFF; --tabicon:#F28C28; --fab-bg:#F28C28; --fab-fg:#121212; --chip-on-bg:#121212; --chip-on-fg:#FFFFFF;
  --card-shadow:4px 4px 0 #121212; --card-border:2px solid #121212; --btn-shadow:3px 3px 0 #121212}
@media (prefers-color-scheme: dark){:root[data-style="street"]:not([data-theme="light"]){
  --bg:#141414; --surface:#1E1E1E; --ink:#F1F1EE; --muted:#A6A6A0; --line:#F1F1EE; --hair:#3A3A37; --accent:#FF9A3D; --accent-ink:#141414; --accent-soft:#3A2714;
  --ok:#7DD39A; --ok-soft:#18291E; --warn:#F2AE6E; --warn-soft:#33240F; --danger:#F38C8C; --danger-soft:#3A1C1C; --shade:rgba(0,0,0,.65); --photo:#2A2A27;
  --tabbg:#000000; --tabfg:#8A8A85; --tabon:#FFFFFF; --tabicon:#FF9A3D; --fab-bg:#FF9A3D; --fab-fg:#141414; --chip-on-bg:#F1F1EE; --chip-on-fg:#141414;
  --card-shadow:4px 4px 0 #F1F1EE; --card-border:2px solid #F1F1EE; --btn-shadow:3px 3px 0 #F1F1EE; color-scheme:dark}}
:root[data-style="street"][data-theme="dark"]{
  --bg:#141414; --surface:#1E1E1E; --ink:#F1F1EE; --muted:#A6A6A0; --line:#F1F1EE; --hair:#3A3A37; --accent:#FF9A3D; --accent-ink:#141414; --accent-soft:#3A2714;
  --ok:#7DD39A; --ok-soft:#18291E; --warn:#F2AE6E; --warn-soft:#33240F; --danger:#F38C8C; --danger-soft:#3A1C1C; --shade:rgba(0,0,0,.65); --photo:#2A2A27;
  --tabbg:#000000; --tabfg:#8A8A85; --tabon:#FFFFFF; --tabicon:#FF9A3D; --fab-bg:#FF9A3D; --fab-fg:#141414; --chip-on-bg:#F1F1EE; --chip-on-fg:#141414;
  --card-shadow:4px 4px 0 #F1F1EE; --card-border:2px solid #F1F1EE; --btn-shadow:3px 3px 0 #F1F1EE; color-scheme:dark}
:root[data-style="street"] .cmeta b{font-weight:700}
:root[data-style="street"] .cmeta .k{font-family:var(--f-en);letter-spacing:.08em;font-size:12px;color:var(--ink)}
:root[data-style="street"] .chip,:root[data-style="street"] .btn{font-weight:700}
:root[data-style="street"] .badge{border:2px solid var(--line);font-weight:700}
:root[data-style="street"] .grid{gap:22px 14px}
:root[data-style="street"] .notice{border:2px solid var(--line)}

/* ===== ポップ（黄色・ダーク時はナイト） ===== */
:root[data-style="pop"]{
  --bg:#FFE14D; --surface:#FFFFFF; --ink:#161616; --muted:#4F4A35; --line:#161616; --hair:rgba(22,22,22,.18);
  --accent:#161616; --accent-ink:#FFE14D; --accent-soft:#FFF4B0;
  --ok:#14653F; --ok-soft:#33C48D; --warn:#161616; --warn-soft:#FFA94D; --danger:#B3122E; --danger-soft:#FFD3DB; --shade:rgba(22,22,22,.5); --photo:#FFFFFF;
  --c1:#4D7CFF; --c2:#33C48D; --c3:#FF7BAC; --c4:#FFFFFF; --card-ink:#161616; --sticker:#FF7BAC; --info-bg:#4D7CFF; --info-fg:#FFFFFF;
  --f-display:"Mochiy Pop One","Hiragino Maru Gothic ProN",sans-serif; --f-body:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif; --f-en:"Mochiy Pop One",sans-serif; --f-num:"M PLUS Rounded 1c",sans-serif;
  --bw:3px; --r:14px; --r-sm:14px; --btn-r:999px;
  --ja-size:36px; --ja-ls:0; --ja-color:var(--ink);
  --tabbg:#FFFFFF; --tabfg:#8A8A8A; --tabon:#161616; --tabicon:#161616; --fab-bg:#161616; --fab-fg:#FFE14D; --chip-on-bg:#161616; --chip-on-fg:#FFE14D;
  --card-shadow:none; --card-border:3px solid #161616; --btn-shadow:3px 3px 0 #FF7BAC; --pop-shadow:4px 4px 0 #161616; color-scheme:light}
:root[data-style="pop"][data-variant="night"]{
  --bg:#1A1B3D; --surface:#2A2C5C; --ink:#F6F1E6; --muted:#C3C1E0; --line:#F6F1E6; --hair:rgba(246,241,230,.2);
  --accent:#F5FF5C; --accent-ink:#1A1B3D; --accent-soft:#2E3070;
  --ok:#5CF2D6; --ok-soft:#5CF2D6; --warn:#1A1B3D; --warn-soft:#FFB36B; --danger:#FF8FA3; --danger-soft:#4A2440; --shade:rgba(0,0,0,.6); --photo:#2A2C5C;
  --c1:#5CF2D6; --c2:#F5FF5C; --c3:#FF6FB5; --c4:#F6F1E6; --card-ink:#1A1B3D; --sticker:#FF6FB5; --info-bg:#5CF2D6; --info-fg:#1A1B3D;
  --tabbg:#2A2C5C; --tabfg:#9A9BC4; --tabon:#F5FF5C; --tabicon:#F5FF5C; --fab-bg:#F5FF5C; --fab-fg:#1A1B3D; --chip-on-bg:#F5FF5C; --chip-on-fg:#1A1B3D;
  --card-border:3px solid #F6F1E6; --btn-shadow:3px 3px 0 #FF6FB5; --pop-shadow:4px 4px 0 #F6F1E6; color-scheme:dark}
.vh .pj,.vh .sfx,.brand .pjb{display:none}
:root[data-style="pop"] body{font-weight:500}
:root[data-style="pop"] .brand .en-b{display:none}
:root[data-style="pop"] .brand .pjb{display:inline;font-size:19px}
:root[data-style="pop"] .vh{align-items:flex-start;margin:14px 0 18px}
:root[data-style="pop"] .vh h1 .en,:root[data-style="pop"] .vh h1 .ja{display:none}
:root[data-style="pop"] .vh h1 .pj{display:block;font-family:var(--f-display);font-size:36px;line-height:1.15}
:root[data-style="pop"] .vh .sub.num{width:74px;height:74px;flex:none;border-radius:50%;background:var(--sticker);color:#161616;border:3px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:15px;line-height:1.2;transform:rotate(10deg);margin-top:4px}
:root[data-style="pop"] .vh .sfx{display:block;font-size:11.5px}
:root[data-style="pop"] .vh .sub:not(.num){font-weight:800;color:var(--ink);background:var(--surface);border:3px solid var(--line);border-radius:999px;padding:3px 12px;font-size:12.5px;margin-top:8px}
:root[data-style="pop"] .chip,:root[data-style="pop"] .btn,:root[data-style="pop"] .pill{font-weight:800}
:root[data-style="pop"] .grid .card{background:var(--c4);color:var(--card-ink);border:3px solid var(--line);border-radius:22px;padding:9px 9px 11px;box-shadow:var(--pop-shadow);gap:7px;transform:rotate(-1.5deg)}
:root[data-style="pop"] .grid .card:nth-child(4n+1){background:var(--c1)}
:root[data-style="pop"] .grid .card:nth-child(4n+2){background:var(--c2);transform:rotate(1.8deg);margin-top:12px}
:root[data-style="pop"] .grid .card:nth-child(4n+3){background:var(--c3);transform:rotate(1.2deg)}
:root[data-style="pop"] .grid .card:nth-child(4n){transform:rotate(-1.2deg);margin-top:12px}
:root[data-style="pop"] .grid .card .ph{border-color:#161616}
:root[data-style="pop"] .grid .card .cmeta .k,:root[data-style="pop"] .grid .card .cmeta span{color:var(--card-ink);opacity:.8}
:root[data-style="pop"] .grid .card .cmeta b{font-weight:800}
:root[data-style="pop"] .grid{gap:18px 14px}
:root[data-style="pop"] .wishgrid{grid-template-columns:1fr}
:root[data-style="pop"] .wishgrid .card,:root[data-style="pop"] .wishgrid .card:nth-child(n){grid-template-columns:100px minmax(0,1fr);align-items:center;gap:12px;transform:none;margin-top:0;background:var(--c4)}
:root[data-style="pop"] .wishgrid .card .ph{aspect-ratio:auto;height:118px}
:root[data-style="pop"] .wishgrid .card:nth-child(4n+1) .ph{background:var(--c3)}
:root[data-style="pop"] .wishgrid .card:nth-child(4n+2) .ph{background:var(--c1)}
:root[data-style="pop"] .wishgrid .card:nth-child(4n+3) .ph{background:var(--c2)}
:root[data-style="pop"] .wishgrid .cmeta b{font-size:15.5px}
:root[data-style="pop"] .wishgrid .cmeta span:last-child{justify-self:start;background:#FFE14D;color:#161616;opacity:1;border:2px solid #161616;border-radius:8px;padding:0 8px;font-weight:800;margin-top:4px}
:root[data-style="pop"] .panel{border:3px solid var(--line);border-radius:22px;box-shadow:var(--pop-shadow)}
:root[data-style="pop"] .panel h2,:root[data-style="pop"] .sec-h{font-family:var(--f-display);color:var(--ink);letter-spacing:0;font-size:15px;font-weight:400}
:root[data-style="pop"] .notice{border:3px solid var(--line);border-radius:18px}
:root[data-style="pop"] .badge{border:2px solid #161616;font-weight:800;color:#161616;background:#FFFFFF}
:root[data-style="pop"] .badge.acc{background:#FFE14D}
:root[data-style="pop"] .st{border:2px solid var(--line);font-weight:800;font-size:11.5px}
:root[data-style="pop"] .st.ok{background:var(--ok-soft);color:#161616}
:root[data-style="pop"] .st.warn{background:var(--warn-soft);color:#161616}
:root[data-style="pop"] .st.info{background:var(--info-bg);color:var(--info-fg)}
:root[data-style="pop"] .st.na{background:#E4E4E4;color:#161616}

/* ===== 端末内データベース（IndexedDB） ===== */
const DB = {
  d:null,
  open(){return new Promise((res,rej)=>{let r;try{r=indexedDB.open("my-closet",1)}catch(e){rej(e);return}
    r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore("profiles",{keyPath:"id"});
      for(const s of ["items","outfits","blobs"]){const os=d.createObjectStore(s,{keyPath:"id"});os.createIndex("profileId","profileId")}
      d.createObjectStore("meta",{keyPath:"key"})};
    r.onsuccess=()=>{this.d=r.result;res()};r.onerror=()=>rej(r.error);r.onblocked=()=>rej(new Error("blocked"))})},
  done(tx){return new Promise((res,rej)=>{tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error||new Error("abort"))})},
  rq(r){return new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})},
  get(n,k){return this.rq(this.d.transaction(n).objectStore(n).get(k))},
  all(n){return this.rq(this.d.transaction(n).objectStore(n).getAll())},
  byProfile(n,pid){return this.rq(this.d.transaction(n).objectStore(n).index("profileId").getAll(pid))},
  onChange:null, ch(n){if(n!=="meta"&&this.onChange)this.onChange()},
  async put(n,v){const tx=this.d.transaction(n,"readwrite");tx.objectStore(n).put(v);await this.done(tx);this.ch(n)},
  async putMany(n,arr){const tx=this.d.transaction(n,"readwrite");const os=tx.objectStore(n);arr.forEach(v=>os.put(v));await this.done(tx);this.ch(n)},
  async del(n,k){const tx=this.d.transaction(n,"readwrite");tx.objectStore(n).delete(k);await this.done(tx);this.ch(n)},
  async delMany(n,keys){if(!keys.length)return;const tx=this.d.transaction(n,"readwrite");const os=tx.objectStore(n);keys.forEach(k=>os.delete(k));await this.done(tx);this.ch(n)},
  async clearAll(){const names=["profiles","items","outfits","blobs","meta"];const tx=this.d.transaction(names,"readwrite");names.forEach(n=>tx.objectStore(n).clear());await this.done(tx)},
  async deleteProfile(pid){const names=["items","outfits","blobs","profiles"];const tx=this.d.transaction(names,"readwrite");
    for(const n of ["items","outfits","blobs"]){const os=tx.objectStore(n);const r=os.index("profileId").getAllKeys(pid);r.onsuccess=()=>r.result.forEach(k=>os.delete(k))}
    tx.objectStore("profiles").delete(pid);await this.done(tx);this.ch("profiles")},
  async restore(data,blobs){const names=["profiles","items","outfits","blobs","meta"];const tx=this.d.transaction(names,"readwrite");
    names.forEach(n=>tx.objectStore(n).clear());
    data.profiles.forEach(v=>tx.objectStore("profiles").put(v));data.items.forEach(v=>tx.objectStore("items").put(v));
    data.outfits.forEach(v=>tx.objectStore("outfits").put(v));blobs.forEach(v=>tx.objectStore("blobs").put(v));
    if(data.activeProfile)tx.objectStore("meta").put({key:"activeProfile",value:data.activeProfile});
    await this.done(tx)}
};
const urlCache = new Map();
async function blobURL(id){if(!id)return "";if(urlCache.has(id))return urlCache.get(id);

function clearURLs(){urlCache.forEach(u=>URL.revokeObjectURL(u));urlCache.clear()}
async function saveBlob(blob,pid){const id="b_"+uid();const buf=await blob.arrayBuffer();await DB.put("blobs",{id,profileId:pid,type:blob.type||"image/jpeg",buf,createdAt:Date.now()});return id}
async function deleteBlobs(ids){ids=ids.filter(Boolean);await DB.delMany("blobs",ids);ids.forEach(id=>{const u=urlCache.get(id);if(u){URL.revokeObjectURL(u);urlCache.delete(id)}})}

/* 画像を端末内で縮小（大きな写真で容量を圧迫しないため） */
async function processImage(file,max=1600,q=.86){
  let src;
  try{src=await createImageBitmap(file,{imageOrientation:"from-image"})}catch(e){
    src=await new Promise((res,rej)=>{const u=URL.createObjectURL(file);const im=new Image();im.onload=()=>{res(im)};im.onerror=()=>rej(new Error("decode"));im.src=u})}
  const w=src.width||src.naturalWidth,h=src.height||src.naturalHeight;if(!w||!h)throw new Error("decode");
  const s=Math.min(1,max/Math.max(w,h));const c=document.createElement("canvas");c.width=Math.round(w*s);c.height=Math.round(h*s);
  const ctx=c.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(src,0,0,c.width,c.height);
  return await new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error("encode")),"image/jpeg",q))}
async function filesToBlobs(fileList){const out=[];let failed=0;for(const f of fileList){try{out.push(await processImage(f))}catch(e){failed++}}
  if(failed)toast(`${failed}枚の画像を読み込めませんでした。JPEGかPNGの画像を選んでください。`);return out}

function itemCard(it,act="openItem"){const ph=it.photoIds?.[0];const c=CAT[it.category];
  const sub=it.kind==="wish"?[it.price!=null?yen(it.price):"",it.wantLevel?"★".repeat(it.wantLevel):""].filter(Boolean).join(" ・ "):[it.brand,it.size].filter(Boolean).join(" ・ ");
  return `<button class="card" data-act="${act}" data-id="${it.id}">
    <div class="ph">${ph?`<img data-blob="${ph}" alt="">`:`<div class="empty">${ICON.shirt}</div>`}
      ${it.isReference?'<span class="badge acc">基準</span>':""}${it.kind==="wish"&&act!=="openItem"?'<span class="badge r">ほしい</span>':""}</div>
    <div class="cmeta"><span class="k">${esc(c?.l||"")}${it.color?" ・ "+esc(it.color):""}</span><b>${esc(it.name||c?.l||"名前なし")}</b><span>${esc(sub)||"&nbsp;"}</span></div></button>`}
function matchesQ(it,q){if(!q)return true;q=q.toLowerCase();return [it.name,it.brand,it.color,it.size,it.notes,CAT[it.category]?.l,it.wishSize].some(v=>String(v||"").toLowerCase().includes(q))}

/* ---- 5. Myサイズ・プロフィール ---- */
function bodyVal(b,k){const e=b?.[k];if(!e)return null;if(e.lr){const l=toNum(e.l),r=toNum(e.r);if(l==null&&r==null)return null;return {l,r,max:Math.max(l??-1,r??-1),avg:(l!=null&&r!=null)?(l+r)/2:(l??r)}}const v=toNum(e.v);return v==null?null:{v,max:v,avg:v}}
function bodyText(b,k){const x=bodyVal(b,k);if(!x)return null;if(x.v!=null)return n1(x.v);return `左 ${x.l!=null?n1(x.l):"—"} / 右 ${x.r!=null?n1(x.r):"—"}`}
function viewMe(){const p=prof();const b=p.body||{};const filled=BODY.filter(x=>x.req&&bodyVal(b,x.k)).length;
  return `<div class="vh"><h1>${hd("My size","Myサイズ","Myサイズ")}</h1><span class="sub">${esc(p.name)}${p.sample?"（架空）":""}</span></div>
  <div class="panel"><div class="row" style="justify-content:space-between;margin-bottom:10px"><h2 style="margin:0">全身写真</h2><button class="link" data-act="photoGuide">撮り方</button></div>
   <div class="photo3">${[["front","正面"],["side","横"],["back","後ろ"]].map(([k,l])=>`<div><label class="ph filebtn" style="display:block" aria-label="${l}の写真を${p.photos?.[k]?"変更":"追加"}">${p.photos?.[k]?`<img data-blob="${p.photos[k]}" alt="${l}">`:`<span class="empty" style="text-align:center">${ICON.plus}<br>追加</span>`}<input type="file" accept="image/*" data-bodyphoto="${k}"></label><div class="cap">${l}${p.photos?.[k]?` ・ <button class="link" style="font-size:12px" data-act="rmBodyPhoto" data-v="${k}">外す</button>`:""}</div></div>`).join("")}</div>
  </div>
  <div class="panel"><div class="row" style="justify-content:space-between;margin-bottom:4px"><h2 style="margin:0">体の寸法</h2><span class="note">${p.measuredAt?`測定日 <span class="num">${fmtDate(p.measuredAt)}</span>`:"未測定"}</span></div>
   <p class="note" style="margin:0 0 6px">基本 <span class="num">${filled}/9</span> 項目 ・ 服のゆとりは足さず、体そのものの寸法です</p>
   <div class="mlist body">${BODY.map(x=>{const t=bodyText(b,x.k);return `<div class="mrow"><div class="nm">${x.l}${x.req?"":"<small>任意</small>"}</div><div class="val ${t?"":"na"}">${t?`${t}<span style="font-size:11px;color:var(--muted)"> cm</span>`:"未入力"}</div><button class="q" data-act="guide" data-k="${x.k}" aria-label="${x.l}の測り方">?</button></div>`}).join("")}</div>
   <div class="row" style="margin-top:12px"><button class="btn primary grow" data-act="guide" data-k="height">採寸ガイドで入力</button><button class="btn" data-act="bodyEdit">まとめて編集</button></div>
  </div>
  ${(p.history||[]).length?`<div class="panel"><h2>更新履歴</h2><div class="hist">${historyHTML(p)}</div></div>`:""}
  <div class="panel"><h2>体型の特徴</h2>${featuresHTML(p)}</div>
  <div class="panel"><div class="row" style="justify-content:space-between;margin-bottom:10px"><h2 style="margin:0">好み・目的</h2><button class="link" data-act="prefEdit">編集</button></div>
   <dl class="kv"><dt>好きな色</dt><dd>${p.colors?.length?p.colors.map(c=>`${swatch(c)} ${esc(c)}`).join("　"):"未設定"}</dd>
   <dt>テイスト</dt><dd>${p.tastes?.length?esc(p.tastes.join("、")):"未設定"}</dd>
   <dt>着心地</dt><dd>${esc((FITPREF.find(f=>f[0]===p.fitPref)||[])[1]||"未設定")}</dd>
   <dt>目的</dt><dd>${p.goals?.length?esc(p.goals.join("、")):"未設定"}</dd></dl></div>
  <div class="panel"><h2>似合わせの提案</h2>${suggestHTML(p)}</div>
  ${AI.ready()?aiSuggestPanel(p):""}`}
function historyHTML(p){const h=(p.history||[]).slice(-8).reverse();
  return h.map((e,i)=>{const prev=h[i+1];const ch=prev?BODY.map(x=>{const a=bodyVal(e.body,x.k)?.avg,bb=bodyVal(prev.body,x.k)?.avg;return (a!=null&&bb!=null&&Math.abs(a-bb)>=.1)?`${x.l} ${signed(a-bb)}`:null}).filter(Boolean):[];
    return `<div class="h"><span class="num">${fmtDate(e.date)}</span><span>${prev?(ch.length?esc(ch.join("、")):"変化なし"):"最初の記録"}</span></div>`}).join("")}

/* 体型の特徴（寸法から説明できる範囲だけ。断定しない） */
function bodyFeatures(b){const g=k=>bodyVal(b,k)?.avg;const h=g("height"),sh=g("shoulder"),ch=g("chest"),wa=g("waist"),hi=g("hip"),ins=g("inseam"),be=g("belly");
  const out=[],miss=[];
  if(h&&sh){const r=sh/h;out.push(r>=.265?{k:"shoulderWide",t:"肩がしっかりしている",d:`肩幅が身長の${Math.round(r*100)}%で、一般的な比率より広め`}:r<=.235?{k:"shoulderNarrow",t:"肩まわりがコンパクト",d:`肩幅が身長の${Math.round(r*100)}%で、一般的な比率より狭め`}:{k:"shoulderMid",t:"肩幅は標準的な範囲",d:`肩幅が身長の${Math.round(r*100)}%`})}else miss.push("身長・肩幅");
  if(ch&&hi){const d=ch-hi;out.push(d>=4?{k:"upperVol",t:"上半身にボリュームがある",d:`胸囲がヒップより${n1(d)}cm大きい`}:d<=-4?{k:"lowerVol",t:"下半身にボリュームがある",d:`ヒップが胸囲より${n1(-d)}cm大きい`}:{k:"balanced",t:"上半身と下半身のボリュームが近い",d:`胸囲とヒップの差 ${n1(Math.abs(d))}cm`})}else miss.push("胸囲・ヒップ");
  if(wa&&hi){const d=hi-wa;out.push(d>=28?{k:"curveLarge",t:"ウエストとヒップの差が大きい",d:`差 ${n1(d)}cm`}:d<=18?{k:"curveSmall",t:"ウエストとヒップの差が小さめ（直線的）",d:`差 ${n1(d)}cm`}:{k:"curveMid",t:"ウエストとヒップの差は標準的",d:`差 ${n1(d)}cm`})}else miss.push("ウエスト・ヒップ");
  if(h&&ins){const r=ins/h;out.push(r>=.46?{k:"legLong",t:"脚が長め",d:`股下が身長の${Math.round(r*100)}%`}:r<=.42?{k:"torsoLong",t:"上半身が長め",d:`股下が身長の${Math.round(r*100)}%`}:{k:"legMid",t:"上半身と脚のバランスは標準的",d:`股下が身長の${Math.round(r*100)}%`})}else miss.push("身長・股下");
  if(wa&&be&&be-wa>=6)out.push({k:"belly",t:"お腹周りがウエストより大きい",d:`差 ${n1(be-wa)}cm`});
  return {out,miss}}
function featuresHTML(p){const {out,miss}=bodyFeatures(p.body||{});
  if(!out.length)return `<p class="note" style="margin:0">寸法が足りないため判断できません。${esc(miss.join("、"))} を入力すると表示されます。</p>`;
  return `<div class="fit">${out.map(f=>`<div class="fitrow"><span class="st info">特徴</span><div>${esc(f.t)}<small>${esc(f.d)}</small></div></div>`).join("")}</div>
  ${miss.length?`<p class="note" style="margin:10px 0 0">判断できない項目：${esc(miss.join("、"))} が未入力</p>`:""}
  <p class="note" style="margin:10px 0 0">一般的な体の比率をもとにした目安です。良い・悪いを表すものではありません。骨格診断（ストレート・ウェーブ・ナチュラル）は寸法だけでは確定できないため、この版では表示していません。</p>`}
function suggestHTML(p){const {out}=bodyFeatures(p.body||{});const ks=new Set(out.map(f=>f.k));const goals=p.goals||[];const cards=[];
  const fav=(p.colors||[]).filter(c=>c!=="柄・その他");
  const colorLine=fav.length?`好きな色（${fav.slice(0,2).join("・")}）をトップスか小物に入れ、全体は3色以内に`:"全体を3色以内にまとめると整って見えます（好きな色を登録すると具体的になります）";
  if(ks.has("shoulderWide")||goals.includes("肩まわりを目立たせたくない"))cards.push({t:"肩まわりをすっきり見せる",s:"Vネック・深めの開き、ラグランやドロップショルダーの袖",b:"首元に縦の開きをつくり、肩の横幅より縦のラインが目に入るように",c:colorLine,r:ks.has("shoulderWide")?"肩幅が身長に対して広めなので、肩の端に視線が集まりにくい形が肩まわりの印象をやわらげます":"目的に「肩まわりを目立たせたくない」が選ばれているため"});
  if(ks.has("shoulderNarrow"))cards.push({t:"肩にほどよく存在感を",s:"パフスリーブ、ボートネック、肩の線がはっきりしたジャケット",b:"上半身にやや張りのある素材を選ぶ",c:colorLine,r:"肩まわりがコンパクトなので、肩に形のあるデザインで上下のバランスが取りやすくなります"});
  if(ks.has("upperVol"))cards.push({t:"上半身は軽く、下に重心を",s:"ハリのある素材のVネック、下はストレートやワイドのボトム",b:"トップスは体に沿いすぎない程度、ボトムに少しボリューム",c:"上を濃い色・下を明るい色にすると重心が下がります",r:"胸囲がヒップより大きいため、ボトム側に量感を足すと全体が整います"});
  if(ks.has("lowerVol"))cards.push({t:"視線を上に集める",s:"Aライン・ストレートのボトム、襟や袖にデザインのあるトップス",b:"トップスに少し量感、ボトムはすとんと落ちる形",c:"トップスに明るい色や柄、ボトムは落ち着いた色に",r:"ヒップが胸囲より大きいため、上半身にポイントを置くとバランスが取りやすくなります"});
  if(ks.has("curveLarge"))cards.push({t:"くびれを活かす",s:"ウエストマークのワンピース、フィット＆フレア",b:"ウエスト位置をはっきりさせ、上下どちらかに広がり",c:"ベルトや切り替えで色を分けると位置がわかりやすくなります",r:"ウエストとヒップの差が大きいため、ウエストを見せる形が体の線に沿います"});
  if(ks.has("curveSmall"))cards.push({t:"直線的なシルエットで",s:"Iライン、ストレートパンツ、直線的なジャケット",b:"縦に長いラインをつくる丈",c:"同系色でまとめると縦の流れが続きます",r:"ウエストとヒップの差が小さめなので、まっすぐな形が体の線と合いやすくなります"});
  if(ks.has("torsoLong")||goals.includes("脚を長く見せたい"))cards.push({t:"脚を長く見せる",s:"ハイウエストのボトム、トップスはタックインか短め丈",b:"ウエスト位置を高めに。ボトムと靴の色をそろえる",c:"ボトムと靴を同じ色か近い色に",r:ks.has("torsoLong")?"股下が身長に対して短めの比率なので、ウエスト位置を上げると脚の見える長さが増えます":"目的に「脚を長く見せたい」が選ばれているため"});
  if(ks.has("legLong"))cards.push({t:"長めの丈も楽しめる",s:"ロング丈のトップスやコート、ワイドパンツ",b:"丈の長いアイテムを重ねても重く見えにくい",c:colorLine,r:"股下が身長に対して長めの比率のため、丈の長いアイテムでもバランスを取りやすいです"});
  if(goals.includes("すっきり見せたい"))cards.push({t:"すっきり見せる",s:"縦のラインが出る羽織り、前を開けて着る",b:"体から離れすぎず、張り付きすぎないゆとり",c:"同系色や濃淡でまとめる",r:"目的に「すっきり見せたい」が選ばれているため"});
  if(goals.includes("華やかにしたい"))cards.push({t:"顔まわりを華やかに",s:"襟・袖にデザインのあるトップス、光沢のある素材",b:"ポイントは1か所に絞る",c:fav.length?`好きな色（${fav[0]}）を顔の近くに`:"明るい色を顔の近くに",r:"目的に「華やかにしたい」が選ばれているため"});
  if(goals.includes("落ち着いた印象にしたい"))cards.push({t:"落ち着いた印象に",s:"ベーシックな形のシャツ・ニット、きれいめのパンツ",b:"丈はひざ下〜くるぶし、ゆとりは標準",c:"ネイビー・グレー・ベージュなどを中心に",r:"目的に「落ち着いた印象にしたい」が選ばれているため"});
  if(goals.includes("動きやすさを優先したい"))cards.push({t:"動きやすさを優先",s:"伸縮のある素材、ゆとりのあるパンツ",b:"肩・ひざまわりに余裕のあるもの",c:colorLine,r:"目的に「動きやすさを優先したい」が選ばれているため"});
  if(!cards.length)return `<p class="note" style="margin:0">提案のための情報が足りません。体の寸法（身長・肩幅・胸囲・ウエスト・ヒップ・股下）か、好み・目的を登録すると表示されます。</p>`;
  return cards.slice(0,5).map(c=>`<div class="sugg"><h3>${esc(c.t)}</h3><dl><dt>シルエット</dt><dd>${esc(c.s)}</dd><dt>丈・量感</dt><dd>${esc(c.b)}</dd><dt>色・組み合わせ</dt><dd>${esc(c.c)}</dd><dt>理由</dt><dd>${esc(c.r)}</dd></dl></div>`).join("")+
  `<p class="note" style="margin:12px 0 0">寸法と、選んだ好み・目的から作った一般的な提案です（AIは使っていません）。似合う・似合わないを決めるものではないので、好きな服を選ぶ参考にしてください。</p>`}

/* ===== 寸法の相性（AIなし・計算のみ） ===== */
function gVal(row,k){const e=row?.m?.[k];const v=toNum(e?.v);if(v==null)return null;return GF[k].t?(e.mode==="round"?v:v*2):v}
function rowOf(it){const r=it.rows||[];return r[it.kind==="wish"?(it.selRow??0):0]||r[0]||{label:"",m:{}}}
function band(e,bands){for(const [max,st,txt] of bands){if(e<max)return [st,txt]}return bands[bands.length-1].slice(1)}
function fitCheck(it,row){const p=prof();const b=p.body||{};const cat=it.category;const res=[];const st=it.stretch||"none";
  const B=k=>bodyVal(b,k);const add=(label,status,text,sub)=>res.push({label,status,text,sub});
  const ease=(gk,bk,label,bands,uses="avg")=>{const g=gVal(row,gk),bv=B(bk);if(g==null||!bv){add(label,"na","判断できません",`${g==null?"服の"+GF[gk].l:""}${g==null&&!bv?"と":""}${!bv?"体の"+BODYK[bk].l:""}が未入力`);return}
    const body=uses==="max"?bv.max:bv.avg;const e=g-body;let [s,t]=band(e,bands);
    if(e<0&&st!=="none")t+=st==="high"?"（よく伸びる素材なら着られる可能性があります）":"（少し伸びる素材でも窮屈になりやすいです）";
    add(label,s,`服の周囲 ${n1(g)}cm − 体 ${n1(body)}cm ＝ ゆとり ${signed(e)}cm`,t)};
  if(["tops","outer","onepiece"].includes(cat)){
    const extra=cat==="outer"?6:0;
    ease("bodyWidth","chest","胸まわり",[[0,"warn","服が体より小さい"],[4+extra,"ok","体に沿うぴったりめ"],[12+extra,"ok","ほどよいゆとり"],[22+extra,"ok","ゆったり"],[1e9,"info","かなりゆったり（オーバーサイズ）"]]);
    const gs=toNum(row?.m?.shoulder?.v),bs=B("shoulder");
    if(gs!=null&&bs){const d=gs-bs.avg;add("肩幅",Math.abs(d)<=2?"ok":d<-2?"warn":"info",`服 ${n1(gs)}cm − 体 ${n1(bs.avg)}cm ＝ ${signed(d)}cm`,Math.abs(d)<=2?"肩の位置がほぼ合う":d<-2?"服の肩幅が狭め。肩や腕を動かしにくいことがあります":"肩の縫い目が肩先より外に落ちる（ドロップショルダーなら意図どおりのことも）")}
    else add("肩幅","na","判断できません",gs==null?"服の肩幅が未入力":"体の肩幅が未入力");
    const sl=toNum(row?.m?.sleeve?.v),ar=B("arm");
    if(sl!=null&&ar){const d=sl-ar.avg;add("袖丈",Math.abs(d)<=2?"ok":"info",`服 ${n1(sl)}cm − 腕 ${n1(ar.avg)}cm ＝ ${signed(d)}cm`,Math.abs(d)<=2?"袖口が手首あたり":d>2?"手首より長め":"手首より短め（7分袖などなら意図どおり）")}
    else add("袖丈","na","判断できません",sl==null?"服の袖丈が未入力":"体の腕の長さが未入力");
    if(cat==="onepiece")ease("waistG","waist","ウエスト",[[0,"warn","服が体より小さい"],[4,"ok","ぴったりめ"],[12,"ok","ほどよいゆとり"],[1e9,"info","ゆったり"]]);
    add("着丈","na","体の寸法とは比べられません","着丈と比べられる体の寸法がないため。基準アイテムとの比較を使ってください");
  }else if(cat==="pants"||cat==="skirt"){
    ease("waistG","waist","ウエスト",[[-2,"warn","服が体より小さい"],[3,"ok","ぴったりめ"],[8,"ok","少し余裕"],[1e9,"info","ゆるめ（ベルト前提）"]]);
    ease("hipG","hip","ヒップ",[[0,"warn","服が体より小さい"],[6,"ok","ぴったりめ"],[14,"ok","ほどよいゆとり"],[1e9,"info","ゆったり"]]);
    if(cat==="pants"){
      ease("thighW","thigh","太もも",[[0,"warn","服が体より小さい"],[6,"ok","ぴったりめ"],[14,"ok","ほどよいゆとり"],[1e9,"info","ゆったり"]],"max");
      const gi=toNum(row?.m?.inseamG?.v),bi=B("inseam");
      if(gi!=null&&bi){const d=bi.avg-gi;add("股下",d<-1?"info":"ok",`体 ${n1(bi.avg)}cm − 服 ${n1(gi)}cm ＝ ${signed(d)}cm`,d<-1?"裾が床に届く長さ。裾上げや厚底の靴が前提になりそうです":`裾は床からおよそ${n1(d)}cm上（股上の深さや靴で変わります）`)}
      else add("股下","na","判断できません",gi==null?"服の股下が未入力":"体の股下が未入力");
    }else add("丈","na","体の寸法とは比べられません","基準アイテムとの比較を使ってください");
  }else add("体との比較","na","このカテゴリは体の寸法と比べていません","靴・バッグ・小物は、表記サイズやメモで確認してください");
  return res}
function refCompare(it,row){const ref=S.items.find(x=>x.kind==="closet"&&x.isReference&&x.category===it.category&&x.id!==it.id);if(!ref)return null;
  const rr=rowOf(ref);const keys=CAT[it.category]?.f||[];const lines=keys.map(k=>{const a=gVal(row,k),bv=gVal(rr,k);return {k,a,b:bv,d:(a!=null&&bv!=null)?a-bv:null}});
  return {ref,lines}}
function fitPanel(it,rowIdx){const row=rowIdx!=null?(it.rows||[])[rowIdx]:rowOf(it);const fc=fitCheck(it,row);const rc=refCompare(it,row);const pref=prof().fitPref;
  return `<p class="note" style="margin:0 0 4px">見た目の相性</p>
   <div class="fitrow" style="margin-bottom:14px"><span class="st na">未判定</span><div style="font-size:13px">AIを接続していないため判定していません。体型の特徴からの一般的な提案は「Myサイズ」で見られます。</div></div>
   <p class="note" style="margin:0 0 4px">寸法上のフィット（目安）${row?.label?` ・ サイズ ${esc(row.label)}`:""}</p>
   <div class="fit">${fc.map(f=>`<div class="fitrow"><span class="st ${f.status}">${esc(f.label)}</span><div>${f.status==="na"?`${esc(f.text)}<small>${esc(f.sub||"")}</small>`:`${esc(f.sub||"")}<small>${esc(f.text)}</small>`}</div></div>`).join("")}</div>
   ${rc?`<p class="note" style="margin:14px 0 4px">基準アイテム「${esc(rc.ref.name||CAT[rc.ref.category]?.l)}」との差（周囲は一周に換算）</p>
    <div class="tbl-wrap"><table class="t"><tr><th>項目</th><th>この服</th><th>基準</th><th>差</th></tr>${rc.lines.map(l=>`<tr><td>${GF[l.k].l}</td><td class="num">${l.a!=null?n1(l.a):"—"}</td><td class="num">${l.b!=null?n1(l.b):"—"}</td><td class="num">${l.d!=null?signed(l.d):"—"}</td></tr>`).join("")}</table></div>`:
    (it.kind==="closet"&&it.isReference?"":`<p class="note" style="margin:12px 0 0">ちょうどいい手持ちの服を「基準アイテム」にすると、服どうしの寸法も比べられます。</p>`)}
   <p class="note" style="margin:12px 0 0">素材：${esc((STRETCH.find(s=>s[0]===(it.stretch||"none"))||[])[1])} ・ 好みの着心地：${esc((FITPREF.find(f=>f[0]===pref)||[])[1]||"未設定")}。数値は目安で、素材の伸び・厚み・デザインや好みのゆとりで感じ方は変わります。</p>`}

/* ===== シート・ダイアログ ===== */
const sheets=[];
function openSheet({title,body,foot="",onMount,cls=""}){const w=document.createElement("div");w.className="sheet-wrap";
  w.innerHTML=`<div class="sheet ${cls}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="sheet-h"><h2>${esc(title)}</h2><button class="iconbtn" data-act="closeSheet" aria-label="閉じる">${ICON.close}</button></div><div class="sheet-b">${body}</div>${foot?`<div class="sheet-f">${foot}</div>`:""}</div>`;
  w.addEventListener("click",e=>{if(e.target===w)closeSheet()});$("#layer").appendChild(w);sheets.push(w);document.body.style.overflow="hidden";
  hydrate(w);onMount&&onMount(w);return w}
function closeSheet(){const w=sheets.pop();if(w)w.remove();if(!sheets.length)document.body.style.overflow=""}
function setSheet(w,{body,foot}){const sc=$(".sheet-b",w).scrollTop;if(body!=null)$(".sheet-b",w).innerHTML=body;if(foot!=null&&$(".sheet-f",w))$(".sheet-f",w).innerHTML=foot;$(".sheet-b",w).scrollTop=sc;hydrate(w)}
function confirmDialog({title,body="",ok="OK",cancel="キャンセル",danger=false}){return new Promise(res=>{const w=document.createElement("div");w.className="modal-wrap";
  w.innerHTML=`<div class="modal" role="alertdialog" aria-modal="true"><h2>${esc(title)}</h2>${body?`<p>${esc(body)}</p>`:""}<div class="row end"><button class="btn sm" data-x="0">${esc(cancel)}</button><button class="btn sm ${danger?"danger":"primary"}" data-x="1">${esc(ok)}</button></div></div>`;
  w.addEventListener("click",e=>{const b=e.target.closest("[data-x]");if(b||e.target===w){w.remove();res(!!(b&&b.dataset.x==="1"))}});document.body.appendChild(w);$('[data-x="1"]',w).focus()})}
let toastT;function toast(msg){$$(".toast").forEach(t=>t.remove());const t=document.createElement("div");t.className="toast";t.setAttribute("role","status");t.textContent=msg;document.body.appendChild(t);clearTimeout(toastT);toastT=setTimeout(()=>t.remove(),2800)}

function slotFor(it){if(it.category==="onepiece")return "tops";return (SLOTS.find(s=>s.cats.includes(it.category))||SLOTS[0]).k}
function outfitEditor(o,presetIds=[],init={}){
  const d=o?JSON.parse(JSON.stringify(o)):{id:null,name:"",purpose:"普段",slots:{tops:[],bottoms:[],shoes:[],bag:[],acc:[]},favorite:false,notes:""};

   <div class="panel" style="padding-block:4px">${SLOTS.map(s=>{const ids=d.slots[s.k]||[];return `<div class="slot"><span class="sl">${s.l}</span><div class="its">${ids.map(id=>{const it=itemById(id);if(!it)return "";return `<div class="mini">${it.photoIds?.[0]?`<img data-blob="${it.photoIds[0]}" alt="${esc(it.name)}">`:""}${it.kind==="wish"?'<span class="w">ほしい</span>':""}</div>`}).join("")||`<span class="note">なし</span>`}</div><button class="btn sm" data-oe="pick" data-v="${s.k}">選ぶ</button></div>`}).join("")}</div>
   <div class="row" style="margin-bottom:14px"><button class="chip" data-oe="fav" aria-pressed="${d.favorite}">★ お気に入り${d.favorite?"に登録中":"にする"}</button></div>
   <div class="field"><label for="o-notes">メモ</label><textarea class="inp" id="o-notes" data-of="notes" maxlength="1000">${esc(d.notes)}</textarea></div>

function measureGuide(startKey){const p=prof();const b=JSON.parse(JSON.stringify(p.body||{}));let i=Math.max(0,BODY.findIndex(x=>x.k===startKey));let date=p.measuredAt&&p.measuredAt===today()?p.measuredAt:today();

/* ===== バックアップ・復元・全削除 ===== */
async function saveFile(filename,blob){let dl=null;
  try{if(window.claude&&typeof window.claude.use==="function")dl=await window.claude.use("downloads")}catch(e){dl=null}
  if(dl){try{await dl.save({filename,data:blob});return "saved"}catch(e){if(e?.code==="declined")return "declined";if(e?.code==="rate_limited"){toast("少し待ってからもう一度お試しください");return "busy"}}}
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},5000);return "fallback"}
async function buildBackup(){const profiles=await DB.all("profiles"),items=await DB.all("items"),outfits=await DB.all("outfits"),blobs=await DB.all("blobs");
  const zip=new JSZip();const bm=[];for(const b of blobs){const path=`images/${b.id}.${b.type==="image/png"?"png":"jpg"}`;zip.file(path,b.buf);bm.push({id:b.id,profileId:b.profileId,type:b.type,path,createdAt:b.createdAt})}
  zip.file("data.json",JSON.stringify({app:"my-closet",format:1,exportedAt:new Date().toISOString(),activeProfile:S.pid,profiles,items,outfits,blobs:bm}));
  zip.file("README.txt","Myクローゼットのバックアップです。\nアプリの「設定 → バックアップを読み込む」からこのZIPファイルを選ぶと復元できます。\nimages フォルダに写真、data.json に登録内容が入っています。\n個人の写真・寸法を含むため、取り扱いにご注意ください。\n");
  return {blob:await zip.generateAsync({type:"blob"}),counts:{p:profiles.length,i:items.length,o:outfits.length,b:blobs.length}}}
async function exportBackup(btn){if(typeof JSZip==="undefined"){toast("バックアップ機能を読み込めませんでした。通信状態を確認して開き直してください。");return}
  btn&&(btn.disabled=true);try{const {blob,counts}=await buildBackup();const d=new Date();
    const name=`my-closet-backup-${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}.zip`;
    const r=await saveFile(name,blob);if(r==="saved"||r==="fallback"){await markBackedUp();toast(`書き出しました（プロフィール${counts.p}件・写真${counts.b}枚）`)}else if(r==="declined")toast("保存を取りやめました")}
  catch(e){toast("書き出しに失敗しました")}finally{btn&&(btn.disabled=false)}}
async function parseBackup(file){const zip=await JSZip.loadAsync(file);const dj=zip.file("data.json");if(!dj)throw new Error("format");
  const data=JSON.parse(await dj.async("string"));if(data.app!=="my-closet"||!Array.isArray(data.profiles))throw new Error("format");
  const blobs=[];let missing=0;for(const m of data.blobs||[]){const f=zip.file(m.path);if(!f){missing++;continue}blobs.push({id:m.id,profileId:m.profileId,type:m.type||"image/jpeg",buf:await f.async("arraybuffer"),createdAt:m.createdAt||Date.now()})}
  data.items=data.items||[];data.outfits=data.outfits||[];return {data,blobs,missing}}
async function restoreFlow(file){if(typeof JSZip==="undefined"){toast("バックアップ機能を読み込めませんでした");return}
  let parsed;try{parsed=await parseBackup(file)}catch(e){await confirmDialog({title:"読み込めませんでした",body:"Myクローゼットのバックアップ（ZIPファイル）を選んでください。",ok:"OK",cancel:"閉じる"});return}
  const {data,blobs,missing}=parsed;
  const ok=await confirmDialog({title:"このバックアップで置き換えますか？",body:`バックアップの内容：プロフィール${data.profiles.length}件・服${data.items.length}点・コーデ${data.outfits.length}件・写真${blobs.length}枚${missing?`（写真${missing}枚が見つかりません）`:""}\n書き出し日時：${data.exportedAt?new Date(data.exportedAt).toLocaleString("ja-JP",{dateStyle:"medium",timeStyle:"short"}):"不明"}\n\nいまこの端末にあるデータはすべて消え、バックアップの内容に置き換わります。`,ok:"置き換える",danger:true});
  if(!ok)return;try{await DB.restore(data,blobs)}catch(e){toast("復元に失敗しました。端末の空き容量を確認してください。");return}
  clearURLs();while(sheets.length)closeSheet();S.profiles=(await DB.all("profiles")).sort((a,b)=>a.createdAt-b.createdAt);
  S.pid=S.profiles.some(p=>p.id===data.activeProfile)?data.activeProfile:(S.profiles[0]?.id||null);await loadProfileData();
  S.bk.changes=0;S.bk.lastAt=S.bk.lastAt||Date.now();await saveBk();render();toast("バックアップから復元しました");return true}

const DRIVE={token:null,exp:0,folderName:"Myクローゼット バックアップ",busy:false,
  available(){return !!CONFIG.googleClientId&&!window.claude},
  load(){if(window.google?.accounts?.oauth2)return Promise.resolve();if(this._lp)return this._lp;
    this._lp=new Promise((res,rej)=>{const sc=document.createElement("script");sc.src="https://accounts.google.com/gsi/client";sc.async=true;sc.onload=()=>res();sc.onerror=()=>{this._lp=null;rej(new Error("load"))};document.head.appendChild(sc)});return this._lp},
  valid(){return !!this.token&&Date.now()<this.exp-60000},
  async auth(consent){await this.load();return new Promise((res,rej)=>{const c=google.accounts.oauth2.initTokenClient({client_id:CONFIG.googleClientId,scope:"https://www.googleapis.com/auth/drive.file",
      callback:r=>{if(r.error){rej(new Error(r.error));return}this.token=r.access_token;this.exp=Date.now()+(Number(r.expires_in)||3600)*1000;res()},
      error_callback:e=>rej(new Error(e?.type||"popup"))});c.requestAccessToken({prompt:consent?"consent":""})})},
  async api(path,opt={}){const r=await fetch(path.startsWith("http")?path:"https://www.googleapis.com/drive/v3/"+path,{...opt,headers:{...(opt.headers||{}),Authorization:"Bearer "+this.token}});
    if(r.status===401){this.token=null;throw new Error("auth")}if(!r.ok)throw new Error("http "+r.status);return r},
  async folder(){const d=S.bk.drive;if(d.folderId){try{const j=await (await this.api(`files/${d.folderId}?fields=id,trashed`)).json();if(!j.trashed)return j.id}catch(e){if(e.message==="auth")throw e}}
    const q=encodeURIComponent(`name='${this.folderName}' and mimeType='application/vnd.google-apps.folder' and trashed=false`);
    let id=(await (await this.api(`files?q=${q}&fields=files(id)`)).json()).files?.[0]?.id;
    if(!id)id=(await (await this.api("files?fields=id",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:this.folderName,mimeType:"application/vnd.google-apps.folder"})})).json()).id;
    d.folderId=id;await saveBk();return id},
  async list(){const fid=await this.folder();const q=encodeURIComponent(`'${fid}' in parents and trashed=false`);
    return (await (await this.api(`files?q=${q}&orderBy=createdTime desc&fields=files(id,name,createdTime,size)&pageSize=20`)).json()).files||[]},
  async upload(blob,name){const fid=await this.folder();
    const init=await this.api("https://www.googleapis.com/upload/drive/v3/files?uploadType=resumable&fields=id",{method:"POST",headers:{"Content-Type":"application/json; charset=UTF-8","X-Upload-Content-Type":"application/zip"},body:JSON.stringify({name,parents:[fid],mimeType:"application/zip"})});
    const loc=init.headers.get("Location");if(!loc)throw new Error("location");
    const r=await fetch(loc,{method:"PUT",headers:{"Content-Type":"application/zip"},body:blob});if(!r.ok)throw new Error("upload "+r.status);
    try{const fl=await this.list();for(const f of fl.slice(5))await this.api("files/"+f.id,{method:"DELETE"}).catch(()=>{})}catch(e){}},
  async download(id){return await (await this.api(`files/${id}?alt=media`)).blob()},
  revoke(){try{if(this.token&&window.google?.accounts?.oauth2)google.accounts.oauth2.revoke(this.token,()=>{})}catch(e){}this.token=null}
};

/* ===== AI（Gemini・利用者本人のAPIキー） ===== */
const AI={key:null,models:{text:null,image:null},
  usable(){return !window.claude},
  ready(){return this.usable()&&!!this.key&&!!this.models.text},
  imgReady(){return this.ready()&&!!this.models.image},
  async load(){const m=await DB.get("meta","ai");if(m?.value){this.key=m.value.key||null;this.models=m.value.models||{text:null,image:null}}},
  async save(){await DB.put("meta",{key:"ai",value:{key:this.key,models:this.models}})},
  async detect(key){const r=await fetch("https://generativelanguage.googleapis.com/v1beta/models?pageSize=200",{headers:{"x-goog-api-key":key}});
    if(!r.ok){const e=new Error("key");e.status=r.status;throw e}
    const ms=((await r.json()).models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes("generateContent")).map(m=>m.name.replace(/^models\//,""));
    const bad=/tts|audio|live|embed|native|learnlm|gemma|robotics|computer|deep-research|exp-/i;
    const ver=n=>{const m=n.match(/gemini-(\d+(?:\.\d+)?)/);return m?parseFloat(m[1]):0};
    const pick=a=>a.sort((x,y)=>(/preview/.test(x)-/preview/.test(y))||(ver(y)-ver(x))||(x.length-y.length))[0]||null;
    const text=pick(ms.filter(n=>/gemini/.test(n)&&/flash-lite/.test(n)&&!/image/.test(n)&&!bad.test(n)))||pick(ms.filter(n=>/gemini/.test(n)&&/flash/.test(n)&&!/image/.test(n)&&!bad.test(n)));
    const image=pick(ms.filter(n=>/gemini/.test(n)&&/image/.test(n)&&/flash/.test(n)&&!bad.test(n)))||pick(ms.filter(n=>/gemini/.test(n)&&/image/.test(n)&&!bad.test(n)));
    return {text,image}},
  async call(model,parts,{json=false,image=false,url=false}={}){const body={contents:[{role:"user",parts}],generationConfig:{}};if(url)body.tools=[{url_context:{}}];
    if(json)body.generationConfig.responseMimeType="application/json";if(image)body.generationConfig.responseModalities=["TEXT","IMAGE"];
    const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`,{method:"POST",headers:{"Content-Type":"application/json","x-goog-api-key":this.key},body:JSON.stringify(body)});
    const j=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(j?.error?.message||"");e.status=r.status;throw e}
    const ps=j.candidates?.[0]?.content?.parts||[];
    return {text:ps.filter(x=>x.text).map(x=>x.text).join(""),images:ps.map(x=>x.inlineData||x.inline_data).filter(Boolean),reason:j.promptFeedback?.blockReason||j.candidates?.[0]?.finishReason||""}}
};
function aiErr(e){const s=e?.status;if(s===429)return "利用の上限に達しました。少し待つか、有料枠（請求先の設定）を確認してください";if(s===400||s===401||s===403)return "APIキーが使えませんでした。設定でキーを確認してください";if(e?.message==="parse")return "AIの返事を読み取れませんでした。もう一度お試しください";return "AIにつなげませんでした。通信状態を確認してください"}
function parseJSON(t){try{return JSON.parse(String(t).replace(/^```(?:json)?\s*|\s*```$/g,""))}catch(e){const m=String(t).match(/\{[\s\S]*\}/);if(m){try{return JSON.parse(m[0])}catch(e2){}}throw new Error("parse")}}
async function b64(blob){const u=new Uint8Array(await blob.arrayBuffer());let s="";for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)}
async function imgPart(blob,max=1024){const small=await processImage(blob,max,.85);return {inline_data:{mime_type:"image/jpeg",data:await b64(small)}}}
async function blobOf(id){const r=await DB.get("blobs",id);return r?new Blob([r.buf],{type:r.type}):null}
function b64ToBlob(d){const bin=atob(d.data);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new Blob([u],{type:d.mimeType||d.mime_type||"image/png"})}

{

}
項目キー（カテゴリごと）：トップス/アウター: ${READ_KEYS.tops} ／ ワンピース: ${READ_KEYS.onepiece} ／ パンツ: ${READ_KEYS.pants} ／ スカート: ${READ_KEYS.skirt} ／ 靴: ${READ_KEYS.shoes} ／ バッグ: ${READ_KEYS.bag}
サイズ表で「バスト」「ウエスト」「ヒップ」が一周の値なら mode は round、「身幅」など平置きの幅なら flat にしてください。
いま選ばれているカテゴリ：${d.category}`}
async function aiReadIntoDraft(d,btn){const photos=d.photos.slice(0,4);if(!photos.length){toast("先に写真を追加してください");return}
  const a=await aiAsk({title:"AIで読み取る",sends:[`この服の写真 ${photos.length}枚（縮小して送ります）`,"いま選んでいるカテゴリ"],cost:"1円未満"});if(!a.ok)return;
  btn.disabled=true;btn.textContent="読み取り中…";
  try{const parts=[{text:readPrompt(d)}];for(const ph of photos){const bl=ph.existing?await blobOf(ph.id):ph.blob;if(bl)parts.push(await imgPart(bl,1400))}
    const r=await AI.call(AI.models.text,parts,{json:true});applyRead(d,parseJSON(r.text))}
  catch(e){toast(aiErr(e))}}
function applyRead(d,j){const f=[];const isNew=!d.id;
  if(j.category&&CAT[j.category]&&isNew&&!d.name&&j.category!==d.category){d.category=j.category;f.push("カテゴリ")}
  if(j.name&&!d.name){d.name=String(j.name).slice(0,60);f.push("名前")}
  if(j.color&&COLORHEX[j.color]&&!d.color){d.color=j.color;f.push("色")}
  if(j.brand&&!d.brand){d.brand=String(j.brand).slice(0,40);f.push("ブランド")}
  if(j.sizeLabel&&d.kind==="closet"&&!d.size){d.size=String(j.sizeLabel).slice(0,20);f.push("サイズ表記")}
  if(j.stretch&&j.stretch!=="none"&&STRETCH.some(x=>x[0]===j.stretch)&&d.stretch==="none"){d.stretch=j.stretch;f.push("素材の伸び")}
  const add=t=>{if(t&&!(d.notes||"").includes(t)){d.notes=(d.notes?d.notes+"\n":"")+t;return true}};
  if(j.material&&add(`素材：${j.material}`))f.push("メモ（素材）");if(j.notes&&add(String(j.notes).slice(0,200)))f.push("メモ");
  const keys=CAT[d.category].f;
  const rows=(Array.isArray(j.sizeTable)?j.sizeTable:[]).map(r=>({label:String(r?.label||"").slice(0,20),m:Object.fromEntries(Object.entries(r?.values||{}).filter(([k,v])=>keys.includes(k)&&toNum(v?.v)!=null&&toNum(v.v)>0&&toNum(v.v)<400).map(([k,v])=>[k,GF[k].t?{v:toNum(v.v),mode:v.mode==="round"?"round":"flat"}:{v:toNum(v.v)}]))})).filter(r=>Object.keys(r.m).length);
  if(rows.length){if(d.kind==="wish"){const empty=d.rows.every(r=>!r.label&&!Object.values(r.m).some(e=>e?.v!=null));
      if(empty){d.rows=rows;d.selRow=0}else rows.forEach(r=>{if(!d.rows.some(x=>x.label===r.label))d.rows.push(r)});
      const want=d.wishSize||"";const i=d.rows.findIndex(r=>r.label&&r.label===want);if(i>=0)d.selRow=i;f.push(`サイズ表 ${rows.length}行`)}
    else{const lab=d.size||j.sizeLabel;const r=rows.find(x=>x.label&&x.label===lab)||(rows.length===1?rows[0]:null);
      if(r){const t=d.rows[0];let n=0;for(const[k,v] of Object.entries(r.m)){if(t.m[k]?.v==null){t.m[k]=v;n++}}if(!t.label)t.label=r.label;if(n)f.push(`寸法 ${n}項目（サイズ${r.label||""}の行）`)}
      else f.push("サイズ表はありましたが、どのサイズか分からないため寸法は入れていません（サイズ表記を入れてもう一度どうぞ）")}}
  d._ai=f.length?f:["読み取れる情報がありませんでした"]}

    catch(err){setSheet(w,{body:`<p class="note">${esc(aiErr(err))}</p>`})}})}
/* 画像試着 */
const TRY_VAR=["服の形や着こなしは写真のまま、自然に着ている様子","着こなしを少し変えた様子（前を開ける、袖を少しまくる、タックインするなど服に合う範囲で）","同じ服を、少し斜めを向いた自然な立ち姿で"];
function tryAIPanel(it,phId){const n=S.tryN||2;const can=it&&phId&&it.photoIds?.length;
  return `<div class="panel"><h2>AIで着せ替え画像を作る</h2>
   <div class="chips" style="margin-bottom:10px">${[2,3].map(k=>`<button class="chip" data-act="tryN" data-v="${k}" aria-pressed="${n===k}">${k}パターン</button>`).join("")}</div>
   <button class="btn primary block" data-act="aiTry" ${can?"":"disabled"}>${can?`${n}パターン作る（約${n*5}〜${n*10}円）`:(!phId?"全身写真を登録してください":!it?"服を選んでください":"写真のある服を選んでください")}</button>
   <ul class="note" style="margin:10px 0 0;padding-left:18px"><li>画像で自然に見えることと、実際にサイズが合うことは別です。丈・着心地・締め付けの保証にはなりません。</li><li>登録した寸法（cm）は画像に反映されません。サイズは下の「寸法上のフィット」で確認してください。</li><li>顔・体形・服の色柄やロゴが変わることがあります。</li></ul></div>`}
function savedTryHTML(){const p=prof();const t=(p.tryons||[]).slice().reverse();if(!t.length)return "";
  return `<div class="panel"><h2>保存した試着画像</h2><div class="pick">${t.map(x=>{const it=itemById(x.itemId);return `<div class="card"><div class="ph" style="aspect-ratio:3/4"><img data-blob="${x.blobId}" alt="試着画像"><span class="badge">AI</span></div><div class="cmeta"><span>${esc(it?.name||"削除された服")}</span><button class="link" style="font-size:12px;justify-self:start" data-act="delTryon" data-id="${x.id}">削除</button></div></div>`}).join("")}</div>
   <p class="note" style="margin:10px 0 0">AIが作った参考画像です。サイズの保証ではありません。</p></div>`}
async function aiTry(){const p=prof();const it=itemById(S.tryItem);const phId=p.photos?.[S.tryPhoto];if(!it||!phId)return;const n=S.tryN||2;
  const label={front:"正面",side:"横",back:"後ろ"}[S.tryPhoto];
  const a=await aiAsk({title:"AIで着せ替え画像を作る",sends:[`全身写真（${label}）1枚`,`服の写真1枚（${it.name||CAT[it.category].l}）`],cost:`${n}枚で約${n*5}〜${n*10}円（画像生成は無料枠がなく、有料枠が必要です）`});if(!a.ok)return;
  const w=openSheet({title:"AIの着せ替え",body:`<p class="note" id="try-st">準備しています…</p>`});
  const res=[];let err=null;
  try{const person=await imgPart(await blobOf(phId),1024);const garment=await imgPart(await blobOf(it.photoIds?.[0])||new Blob(),1024);
    for(let i=0;i<n;i++){const st=$("#try-st",w);if(st)st.textContent=`${i+1} / ${n} 枚目を作っています…（1枚20〜40秒ほど）`;
      try{const r=await AI.call(AI.models.image,[{text:`1枚目の人物が、2枚目の服を着ている写真を1枚作ってください。人物の顔・髪型・体形・ポーズ・背景はできるだけ1枚目のままにしてください。服の色・柄・ロゴ・形はできるだけ2枚目の通りにしてください。様子：${TRY_VAR[i]}。`},person,garment],{image:true});
        if(r.images[0])res.push({i,blob:b64ToBlob(r.images[0])});else err=err||{msg:"画像が作られませんでした（内容によっては作れないことがあります）"}}
      catch(e){err={msg:aiErr(e),status:e.status};if(e.status===429||e.status===400||e.status===403)break}}}
  catch(e){err={msg:"写真を準備できませんでした"}}
  if(!res.length){setSheet(w,{body:`<p class="note">${esc(err?.msg||"画像を作れませんでした")}</p>${err?.status===429?`<p class="note">画像生成は無料枠では使えません。Google AI Studioで請求先（有料枠）を設定してください。</p>`:""}`});return}
  const urls=res.map(r=>URL.createObjectURL(r.blob));
  setSheet(w,{body:`<p class="note" style="margin:0 0 10px">AIが作った参考画像です。サイズや着心地の保証ではありません。${err?"一部の画像は作れませんでした。":""}</p>
   <div style="display:grid;grid-template-columns:repeat(${Math.min(res.length,2)},minmax(0,1fr));gap:10px">${res.map((r,k)=>`<div style="display:grid;gap:6px"><div class="ph" style="aspect-ratio:3/4"><img src="${urls[k]}" alt="パターン${"ABC"[r.i]}"></div><span class="note">パターン${"ABC"[r.i]}</span><button class="btn sm" data-keep="${k}">保存</button></div>`).join("")}</div>`});
  w.addEventListener("click",async e=>{const b=e.target.closest("[data-keep]");if(!b||b.disabled)return;b.disabled=true;const r=res[+b.dataset.keep];
    const bid=await saveBlob(r.blob,p.id);p.tryons=p.tryons||[];p.tryons.push({id:"t_"+uid(),itemId:it.id,blobId:bid,pattern:"ABC"[r.i],photo:S.tryPhoto,createdAt:Date.now()});await saveProfile(p);b.textContent="保存しました";render()})}

/* ===== 操作 ===== */
const ACT={
  tab:b=>{S.tab=b.dataset.tab;try{localStorage.setItem("mc-tab",S.tab)}catch(e){}while(sheets.length)closeSheet();render();scrollTo(0,0)},
  closeSheet:()=>closeSheet(),
  settings:()=>settingsSheet(), profiles:()=>profilesSheet(),
  about:()=>openSheet({title:"このアプリについて",body:aboutHTML()}),
  createFirst:async()=>{const n=$("#w-name").value.trim();if(!n){toast("名前を入力してください");$("#w-name").focus();return}const p=newProfile(n);await saveProfile(p);try{navigator.storage?.persist?.()}catch(e){}await switchProfile(p.id);S.tab="me";render();
    if(DRIVE.available()&&!S.bk.drive.enabled){const w=openSheet({title:"消えても戻せるようにしませんか？",body:`<p style="margin:0 0 10px">データはこのスマホの中だけにあるため、ブラウザのデータを消したり機種変更したりすると消えてしまいます。</p><p style="margin:0 0 14px"><b>Googleドライブ自動保存</b>をオンにすると、変更のたびにあなたのGoogleドライブへ保存され、別のスマホや開き方でも「Googleドライブから戻す」で元通りにできます。</p><p class="note" style="margin:0">保存先はあなた自身のGoogleドライブだけです。作った人には届きません。</p>`,foot:`<button class="btn" data-act="closeSheet">あとで</button><button class="btn primary" data-act="driveSetup">オンにする</button>`})}},
  sample:()=>createSample(),
  aiSaveKey:async b=>{const v=($("#ai-key")?.value||"").trim();if(!v){toast("APIキーを貼ってください");return}b.disabled=true;b.textContent="確認しています…";
    try{const m=await AI.detect(v);if(!m.text){toast("このキーで使えるモデルが見つかりませんでした");return}AI.key=v;AI.models=m;await AI.save();while(sheets.length)closeSheet();render();settingsSheet();toast("AIを使えるようになりました")}
    catch(e){toast(e.status?"APIキーが使えませんでした。コピーし直してください":"Googleにつなげませんでした")}finally{b.disabled=false;b.textContent="保存"}},
  aiTest:async()=>{try{const m=await AI.detect(AI.key);AI.models=m;await AI.save();toast("接続できています");while(sheets.length)closeSheet();settingsSheet()}catch(e){toast(e.status?"APIキーが使えなくなっています":"Googleにつなげませんでした")}},
  aiDelKey:async()=>{if(!await confirmDialog({title:"APIキーを削除しますか？",body:"この端末からキーを消します。AIの機能は使えなくなります。",ok:"削除",danger:true}))return;AI.key=null;AI.models={text:null,image:null};await DB.del("meta","ai");while(sheets.length)closeSheet();render();toast("キーを削除しました")},
  aiSuggest:()=>aiSuggest(), aiCoord:b=>aiCoord(b.dataset.base||null), aiTry:()=>aiTry(),
  tryN:b=>{S.tryN=+b.dataset.v;render()},
  delTryon:async b=>{const p=prof();const t=(p.tryons||[]).find(x=>x.id===b.dataset.id);if(!t)return;if(!await confirmDialog({title:"この画像を削除しますか？",ok:"削除",danger:true}))return;await deleteBlobs([t.blobId]);p.tryons=p.tryons.filter(x=>x.id!==t.id);await saveProfile(p);render()},
  setStyle:b=>{applyStyle(b.dataset.v);render();$$(".sty").forEach(x=>x.setAttribute("aria-pressed",x.dataset.v===b.dataset.v))},
  cat:b=>{S.cat=b.dataset.v;$("#closet-chips").innerHTML=catChips(S.items.filter(i=>i.kind==="closet"),S.cat,"cat");$("#closet-grid").innerHTML=closetGrid();hydrate($("#closet-grid"))},
  wcat:b=>{S.wcat=b.dataset.v;render()}, wsort:b=>{S.wsort=b.dataset.v;render()}, ofilter:b=>{S.ofilter=b.dataset.v;render()},
  newItem:b=>itemEditor(null,b.dataset.kind),
  openItem:b=>openItem(b.dataset.id), openItem2:b=>openItem(b.dataset.id),
  editItem:b=>itemEditor(itemById(b.dataset.id)),
  deleteItem:async b=>{const it=itemById(b.dataset.id);if(!await confirmDialog({title:"この服を削除しますか？",body:"写真も削除され、コーデからも外れます。元に戻せません。",ok:"削除",danger:true}))return;
    await deleteBlobs(it.photoIds||[]);await DB.del("items",it.id);S.items=S.items.filter(x=>x.id!==it.id);
    const touched=[];S.outfits.forEach(o=>{let ch=false;SLOTS.forEach(s=>{const a=o.slots?.[s.k]||[];if(a.includes(it.id)){o.slots[s.k]=a.filter(x=>x!==it.id);ch=true}});if(ch)touched.push(o)});
    if(touched.length)await DB.putMany("outfits",touched);if(S.tryItem===it.id)S.tryItem=null;closeSheet();render();toast("削除しました")},
  toggleRef:async b=>{const it=itemById(b.dataset.id);const on=!it.isReference;const ch=[];
    if(on)S.items.forEach(x=>{if(x.kind==="closet"&&x.category===it.category&&x.isReference&&x.id!==it.id){x.isReference=false;ch.push(x)}});it.isReference=on;ch.push(it);
    await DB.putMany("items",ch);closeSheet();render();openItem(it.id);toast(on?"基準アイテムにしました":"基準アイテムから外しました")},
  moveToCloset:async b=>{const it=itemById(b.dataset.id);const r=rowOf(it);
    if(!await confirmDialog({title:"Myクローゼットへ移動しますか？",body:`購入済みとして移動します。サイズは「${r.label||it.wishSize||"未設定"}」の行の寸法を残します。`,ok:"移動する"}))return;
    Object.assign(it,{kind:"closet",size:r.label||it.wishSize||"",rows:[r],selRow:0,purchasedAt:today(),updatedAt:Date.now(),wantLevel:null});
    await DB.put("items",it);closeSheet();S.tab="closet";render();toast("Myクローゼットへ移動しました");openItem(it.id)},
  tryThis:b=>{S.tryItem=b.dataset.id;S.tab="try";while(sheets.length)closeSheet();render();scrollTo(0,0)},
  matchThis:b=>matchItem(b.dataset.id),
  outfitWith:b=>{closeSheet();outfitEditor(null,[b.dataset.id])},
  newOutfit:()=>outfitEditor(null), editOutfit:b=>outfitEditor(S.outfits.find(o=>o.id===b.dataset.id)),
  tryPick:b=>{S.tryItem=S.tryItem===b.dataset.id?null:b.dataset.id;const sx=$(".strip")?.scrollLeft;render();if($(".strip"))$(".strip").scrollLeft=sx},
  tryPhoto:b=>{S.tryPhoto=b.dataset.v;render()},
  guide:b=>measureGuide(b.dataset.k), guideOnly:b=>guideOnly(b.dataset.k),
  bodyEdit:()=>bodyEditor(), prefEdit:()=>prefEditor(), photoGuide:()=>photoGuide(), garmentGuide:()=>garmentGuide(),
  rmBodyPhoto:async b=>{const p=prof();const k=b.dataset.v;if(!await confirmDialog({title:"この写真を外しますか？",body:"端末からも削除されます。",ok:"外す",danger:true}))return;await deleteBlobs([p.photos[k]]);p.photos[k]=null;await saveProfile(p);render()},
  exportBackup:()=>quickBackup(), quickBackup:()=>quickBackup(),
  snoozeBk:async()=>{S.bk.snoozeUntil=Date.now()+864e5;await saveBk();render()},
  driveSetup:()=>driveSetup(), driveNow:()=>driveBackupNow(true), driveRestore:()=>driveRestore(),
  driveOff:async()=>{if(!await confirmDialog({title:"自動保存をやめますか？",body:"Googleドライブにある今までのバックアップは消えません。",ok:"やめる"}))return;S.bk.drive.enabled=false;S.driveTap=false;DRIVE.revoke();await saveBk();while(sheets.length)closeSheet();render();toast("自動保存をやめました")},
  wipeAll:()=>wipeFlow(),
  persist:async()=>{try{const r=await navigator.storage?.persist?.();toast(r?"このブラウザに保存の継続を依頼しました":"この環境では依頼できませんでした。バックアップをおすすめします")}catch(e){toast("この環境では依頼できませんでした。バックアップをおすすめします")}}
};
document.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(!b)return;const f=ACT[b.dataset.act];if(f){e.preventDefault();f(b,e)}});
document.addEventListener("input",e=>{if(e.target.id==="closet-q"){S.q=e.target.value;$("#closet-grid").innerHTML=closetGrid();hydrate($("#closet-grid"))}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&sheets.length&&!$(".modal-wrap"))closeSheet();if(e.key==="Enter"&&e.target.id==="w-name")ACT.createFirst()});
document.addEventListener("change",e=>{if(e.target.dataset?.restore){const f=e.target.files?.[0];e.target.value="";if(f)restoreFlow(f)}});
document.addEventListener("change",async e=>{const k=e.target.dataset?.bodyphoto;if(!k||!e.target.files?.[0])return;const [blob]=await filesToBlobs([e.target.files[0]]);e.target.value="";if(!blob)return;
  const p=prof();const old=p.photos[k];p.photos[k]=await saveBlob(blob,p.id);await saveProfile(p);if(old)await deleteBlobs([old]);render();toast("写真を保存しました")});
boot();
if("serviceWorker" in navigator&&/github\.io$/.test(location.hostname)){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{})})}
</script>
